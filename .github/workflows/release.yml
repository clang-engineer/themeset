name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build archives and Homebrew formula
        run: sh scripts/package.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-build
          path: dist/*
